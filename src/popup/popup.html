<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dx.block</title>
<link rel="stylesheet" href="../ui/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true"><path d="M64 10 L108 26 V62 C108 90 89 108 64 118 C39 108 20 90 20 62 V26 Z"/></svg>
      <span class="logo">dx<b>.</b>block</span>
    </div>
    <div class="status" id="status"><i></i><span id="status-text">Live</span></div>
    <button class="icon" id="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <section class="hero">
    <canvas id="web" aria-label="Live map of blocked trackers"></canvas>
    <div class="overlay-l"><b id="count">0</b><span>blocked on this page</span></div>
    <div class="grade" id="grade" title="How hard this site tried to track you (everything shown was stopped)"><b id="grade-l">A</b><span>site<br>privacy</span></div>
    <div class="host"><span id="host">—</span></div>
  </section>

  <section class="pulse-row">
    <canvas id="chart" aria-hidden="true"></canvas>
    <span class="rate"><b id="rate">0</b>/s</span>
  </section>

  <section class="stats">
    <div class="stat ad"><b id="s-ads">0</b><span>Ads</span></div>
    <div class="stat tracker"><b id="s-trackers">0</b><span>Trackers</span></div>
    <div class="stat company"><b id="s-companies">0</b><span>Companies</span></div>
    <div class="stat fp" title="Fingerprinting attempts stopped"><b id="s-fp">0</b><span>Fingerprint</span></div>
    <div class="stat hidden"><b id="s-hidden">0</b><span>Hidden</span></div>
  </section>

  <a class="update" id="update" hidden target="_blank" rel="noopener"><b>Update available</b><span id="update-v"></span><i>Get it →</i></a>
  <div class="access" id="access" hidden><span>dx.block needs permission to work on websites.</span><button class="primary" id="grant">Allow</button></div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="ftab on" data-view="live"><i class="live-dot"></i>Live</button>
      <button class="ftab" data-view="companies">Companies</button>
      <button class="ftab" data-view="site">This site</button>
    </div>
    <ul id="live" class="view"><li class="empty">Watching this page for ads and trackers…</li></ul>
    <ul id="companies" class="view" hidden></ul>
    <div id="site" class="view" hidden>
      <p id="site-summary" class="muted"></p>
      <div id="perms" class="perms"></div>
    </div>
  </section>

  <label class="site-toggle" id="site-row">
    <div><div class="site-title" id="site-title">Protection on</div><div class="muted small" id="site-sub">Blocking ads &amp; trackers on this site</div></div>
    <span class="switch"><input type="checkbox" id="power" checked><span></span></span>
  </label>

  <div class="actions">
    <button id="pick" class="primary" title="Block an element on this page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l7.1 17 2.5-7.4L20 10.1 3 3Z"/></svg>Block element
    </button>
    <button id="dashboard" title="Open the live dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg>Dashboard
    </button>
    <button id="report" title="Report an ad that got through or a broken site">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h9l1 2h5v10h-7l-1-2H7v7H5Z"/></svg>Report
    </button>
  </div>
  <footer id="footer" class="muted"></footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
